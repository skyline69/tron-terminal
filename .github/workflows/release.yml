name: Release

# Pushing to the release branch publishes the version in Cargo.toml as a GitHub
# release, with notes generated by git-cliff from the commits since the previous
# release. A version that is already tagged is skipped, so bump the version
# before pushing. Running the workflow by hand with `publish` off builds every
# package without releasing, to test packaging changes.
#
# Packages:
#   tron-VERSION-ARCH-linux.tar.gz   binary with install.sh (x86_64, aarch64)
#   tron-VERSION-ARCH.AppImage       single file for any distribution (x86_64, aarch64)
#   tron-VERSION-ARCH.flatpak        Flatpak bundle, shells run on the host (x86_64, aarch64)
#   tron-VERSION-ARCH-macos.tar.gz   binary with install.sh (x86_64, aarch64)
#   tron-VERSION-macos.dmg           universal tron.app on a designed disk image

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release (off builds the packages only)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      build: ${{ steps.version.outputs.build }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Read the version
        id: version
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        run: |
          version=$(awk -F'"' '/^\[workspace\.package\]/ { s = 1; next } /^\[/ { s = 0 } s && /^version *=/ { print $2; exit }' Cargo.toml)
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = true ]; then
            echo "::notice::Building the packages of $tag without publishing."
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "::notice::$tag is already released. Bump the version in Cargo.toml to publish a new release."
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  linux:
    needs: version
    if: needs.version.outputs.build == 'true'
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # AlmaLinux 9 has glibc 2.34, so the binaries run on distributions from 2021 on.
    container: almalinux:9
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Install build tools and libraries
        # tar and zstd for the Rust cache, file for appimagetool.
        run: dnf -y install gcc git tar zstd file pkgconf-pkg-config fontconfig-devel libxkbcommon-devel wayland-devel
      - uses: actions/checkout@v7.0.1
      # dtolnay/rust-toolchain publishes no releases; the `stable` ref installs the latest stable Rust.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: linux-${{ matrix.arch }}
      - name: Build
        run: cargo build --release --locked -p tron
      - name: Package the archive
        run: |
          dir="tron-$VERSION-$ARCH-linux"
          mkdir -p "$dir/dist"
          cp target/release/tron install.sh README.md LICENSE-MIT LICENSE-APACHE "$dir/"
          cp dist/dev.tron.Terminal.desktop dist/dev.tron.Terminal.metainfo.xml dist/dev.tron.Terminal.svg dist/dev.tron.Terminal.png "$dir/dist/"
          tar -czf "$dir.tar.gz" "$dir"
          sha256sum "$dir.tar.gz" > "$dir.tar.gz.sha256"
      - name: Package the AppImage
        run: |
          appdir=tron.AppDir
          mkdir -p "$appdir/usr/bin" "$appdir/usr/share/applications" "$appdir/usr/share/metainfo" \
            "$appdir/usr/share/icons/hicolor/256x256/apps" "$appdir/usr/share/icons/hicolor/scalable/apps"
          cp target/release/tron "$appdir/usr/bin/"
          cp dist/dev.tron.Terminal.desktop "$appdir/usr/share/applications/"
          cp dist/dev.tron.Terminal.desktop "$appdir/"
          cp dist/dev.tron.Terminal.metainfo.xml "$appdir/usr/share/metainfo/dev.tron.Terminal.appdata.xml"
          cp dist/dev.tron.Terminal.png "$appdir/usr/share/icons/hicolor/256x256/apps/"
          cp dist/dev.tron.Terminal.svg "$appdir/usr/share/icons/hicolor/scalable/apps/"
          cp dist/dev.tron.Terminal.png "$appdir/"
          ln -s dev.tron.Terminal.png "$appdir/.DirIcon"
          ln -s usr/bin/tron "$appdir/AppRun"
          # appimagetool is only published as its rolling "continuous" build.
          curl -fsSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-$ARCH.AppImage"
          chmod +x appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool \
            -u "gh-releases-zsync|skyline69|tron-terminal|latest|tron-*-$ARCH.AppImage.zsync" \
            "$appdir" "tron-$VERSION-$ARCH.AppImage"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-linux-${{ matrix.arch }}
          path: |
            tron-*.tar.gz*
            tron-*.AppImage*
          if-no-files-found: error

  flatpak:
    needs: version
    if: needs.version.outputs.build == 'true'
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # The image only provides flatpak-builder; the 26.08 runtime is installed from Flathub.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          manifest-path: dist/flatpak/dev.tron.Terminal.yml
          # The action only adds the architecture to the name for several in one job.
          bundle: tron-${{ needs.version.outputs.version }}-${{ matrix.arch }}.flatpak
          arch: ${{ matrix.arch }}
          cache-key: flatpak-builder-${{ hashFiles('Cargo.lock') }}
          artifact-name: release-flatpak-${{ matrix.arch }}

  macos:
    needs: version
    if: needs.version.outputs.build == 'true'
    strategy:
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCH: ${{ matrix.arch }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p tron --target "$TARGET"
      - name: Package the archive
        run: |
          dir="tron-$VERSION-$ARCH-macos"
          mkdir -p "$dir/dist" bin
          cp "target/$TARGET/release/tron" install.sh README.md LICENSE-MIT LICENSE-APACHE "$dir/"
          cp dist/dev.tron.Terminal.desktop dist/dev.tron.Terminal.metainfo.xml dist/dev.tron.Terminal.svg dist/dev.tron.Terminal.png "$dir/dist/"
          tar -czf "$dir.tar.gz" "$dir"
          shasum -a 256 "$dir.tar.gz" > "$dir.tar.gz.sha256"
          cp "target/$TARGET/release/tron" "bin/tron-$ARCH"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-macos-${{ matrix.arch }}
          path: tron-*.tar.gz*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-binary-${{ matrix.arch }}
          path: bin/tron-${{ matrix.arch }}
          if-no-files-found: error

  dmg:
    needs: [version, macos]
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: macos-binary-*
          path: bin
          merge-multiple: true
      - name: Build the universal tron.app
        run: |
          app=tron.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create bin/tron-aarch64 bin/tron-x86_64 -output "$app/Contents/MacOS/tron"
          chmod +x "$app/Contents/MacOS/tron"
          sed "s/@VERSION@/$VERSION/g" dist/macos/Info.plist > "$app/Contents/Info.plist"
          iconset=tron.iconset
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" dist/macos/icon-1024.png --out "$iconset/icon_${size}x$size.png" > /dev/null
            sips -z $((size * 2)) $((size * 2)) dist/macos/icon-1024.png --out "$iconset/icon_${size}x$size@2x.png" > /dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/tron.icns"
          cp "$app/Contents/Resources/tron.icns" tron.icns
          # Ad-hoc signature: not notarized, so the first launch needs Open from the context menu.
          codesign --force --sign - "$app"
      - name: Build the disk image
        run: |
          tiffutil -cathidpicheck dist/macos/background.png dist/macos/background@2x.png -out background.tiff
          pipx run --spec dmgbuild==1.6.7 dmgbuild -s dist/macos/dmg-settings.py \
            -D app=tron.app -D background=background.tiff -D icon=tron.icns \
            tron "tron-$VERSION-macos.dmg"
          shasum -a 256 "tron-$VERSION-macos.dmg" > "tron-$VERSION-macos.dmg.sha256"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-dmg
          path: tron-*.dmg*
          if-no-files-found: error

  release:
    needs: [version, linux, flatpak, macos, dmg]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4.9.0
        with:
          config: cliff.toml
          args: --unreleased --tag ${{ needs.version.outputs.tag }} --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
      - name: Generate the changelog
        uses: orhun/git-cliff-action@v4.9.0
        with:
          config: cliff.toml
          args: --tag ${{ needs.version.outputs.tag }}
        env:
          OUTPUT: CHANGELOG.md
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          (cd artifacts && sha256sum tron-* | grep -v '\.sha256$' > SHA256SUMS)
          gh release create "$TAG" artifacts/* CHANGELOG.md \
            --target "$GITHUB_SHA" \
            --title "tron $VERSION" \
            --notes-file RELEASE_NOTES.md
