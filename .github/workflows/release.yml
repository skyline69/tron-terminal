name: Release

# Pushing to the release branch publishes the version in Cargo.toml as a GitHub
# release: archives for Linux and macOS, with notes generated by git-cliff from
# the commits since the previous release. A version that is already tagged is
# skipped, so bump the version before pushing.

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Read the version
        id: version
        run: |
          version=$(awk -F'"' '/^\[workspace\.package\]/ { s = 1; next } /^\[/ { s = 0 } s && /^version *=/ { print $2; exit }' Cargo.toml)
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "::notice::$tag is already released. Bump the version in Cargo.toml to publish a new release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.publish == 'true'
    strategy:
      matrix:
        include:
          - name: x86_64-linux
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - name: aarch64-linux
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - name: aarch64-macos
            target: aarch64-apple-darwin
            runner: macos-latest
          - name: x86_64-macos
            target: x86_64-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libfontconfig-dev
      # dtolnay/rust-toolchain publishes no releases; the `stable` ref installs the latest stable Rust.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p tron --target ${{ matrix.target }}
      # The archive holds the binary next to install.sh, which installs it without building.
      - name: Package
        env:
          VERSION: ${{ needs.version.outputs.version }}
          NAME: ${{ matrix.name }}
          TARGET: ${{ matrix.target }}
        run: |
          dir="tron-$VERSION-$NAME"
          mkdir -p "$dir/dist"
          cp "target/$TARGET/release/tron" install.sh README.md LICENSE-MIT LICENSE-APACHE "$dir/"
          cp dist/dev.tron.Terminal.* "$dir/dist/"
          tar -czf "$dir.tar.gz" "$dir"
          shasum -a 256 "$dir.tar.gz" > "$dir.tar.gz.sha256"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.name }}
          path: tron-*.tar.gz*
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4.9.0
        with:
          config: cliff.toml
          args: --unreleased --tag ${{ needs.version.outputs.tag }} --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
      - name: Generate the changelog
        uses: orhun/git-cliff-action@v4.9.0
        with:
          config: cliff.toml
          args: --tag ${{ needs.version.outputs.tag }}
        env:
          OUTPUT: CHANGELOG.md
      - uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$TAG" artifacts/* CHANGELOG.md \
            --target "$GITHUB_SHA" \
            --title "tron $VERSION" \
            --notes-file RELEASE_NOTES.md
