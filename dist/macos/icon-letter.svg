<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Foreground layer of the macOS icon (Icon.icon): the chrome T of
       dev.tron.Terminal.svg with its pink and cyan offsets, centered on a clear canvas. -->
  <defs>
    <!-- Chrome: sky reflection above a dark horizon line, warm light below. -->
    <linearGradient id="chrome" gradientUnits="userSpaceOnUse" x1="0" y1="48" x2="0" y2="206">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.17" stop-color="#8fe6ff"/>
      <stop offset="0.2" stop-color="#1b1f6f"/>
      <stop offset="0.55" stop-color="#6a4fd8"/>
      <stop offset="1" stop-color="#ffb3f0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- The T spans 52..208 by 48..212 in the 256 unit icon; centered and scaled here. -->
  <g transform="translate(512 512) scale(4.3) translate(-130 -130)" stroke-linejoin="round">
    <path d="M60 56 H208 V94 H154 V212 H114 V94 H60 Z" fill="#4fd6ff"/>
    <path d="M56 52 H204 V90 H150 V208 H110 V90 H56 Z" fill="#ff3d8b"/>
    <path d="M52 48 H200 V86 H146 V204 H106 V86 H52 Z" fill="url(#chrome)" stroke="#0d0221" stroke-width="4" filter="url(#glow)"/>
    <path d="M57 53 H195" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  </g>
</svg>
