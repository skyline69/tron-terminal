<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <!-- Background of tron's macOS disk image window. Icons sit at (170, 186) and (490, 186). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0221"/>
      <stop offset="0.62" stop-color="#2a0a4a"/>
      <stop offset="1" stop-color="#3a0c5c"/>
    </linearGradient>
    <radialGradient id="horizon" cx="0.5" cy="0.72" r="0.55">
      <stop offset="0" stop-color="#ff4fd8" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#ff4fd8" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ff4fd8" stop-opacity="0"/>
    </radialGradient>
    <!-- User space coordinates: a bounding box gradient on a horizontal line has zero height and draws nothing. -->
    <linearGradient id="arrow" gradientUnits="userSpaceOnUse" x1="264" y1="0" x2="394" y2="0">
      <stop offset="0" stop-color="#ff4fd8"/>
      <stop offset="1" stop-color="#4fd6ff"/>
    </linearGradient>
    <linearGradient id="gridfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridmask">
      <rect x="0" y="288" width="660" height="112" fill="url(#gridfade)"/>
    </mask>
    <linearGradient id="shelf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9a7d6" stop-opacity="0"/>
      <stop offset="0.12" stop-color="#b9a7d6" stop-opacity="0.9"/>
      <stop offset="0.88" stop-color="#b9a7d6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#b9a7d6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="660" height="400" fill="url(#sky)"/>
  <rect width="660" height="400" fill="url(#horizon)"/>

  <!-- A few faint stars. -->
  <g fill="#ffffff">
    <circle cx="62" cy="38" r="1" opacity="0.5"/>
    <circle cx="148" cy="84" r="0.8" opacity="0.35"/>
    <circle cx="236" cy="30" r="1.1" opacity="0.45"/>
    <circle cx="332" cy="66" r="0.8" opacity="0.3"/>
    <circle cx="418" cy="24" r="1" opacity="0.5"/>
    <circle cx="512" cy="72" r="0.9" opacity="0.35"/>
    <circle cx="604" cy="42" r="1.1" opacity="0.45"/>
    <circle cx="28" cy="118" r="0.8" opacity="0.3"/>
    <circle cx="630" cy="126" r="0.8" opacity="0.3"/>
  </g>

  <!-- Neon perspective grid below the horizon. -->
  <g stroke="#ff4fd8" stroke-width="1" fill="none" mask="url(#gridmask)" opacity="0.55">
    <line x1="0" y1="290" x2="660" y2="290"/>
    <line x1="0" y1="296" x2="660" y2="296"/>
    <line x1="0" y1="304" x2="660" y2="304"/>
    <line x1="0" y1="315" x2="660" y2="315"/>
    <line x1="0" y1="330" x2="660" y2="330"/>
    <line x1="0" y1="350" x2="660" y2="350"/>
    <line x1="0" y1="376" x2="660" y2="376"/>
    <line x1="330" y1="288" x2="330" y2="400"/>
    <line x1="330" y1="288" x2="250" y2="400"/>
    <line x1="330" y1="288" x2="410" y2="400"/>
    <line x1="330" y1="288" x2="170" y2="400"/>
    <line x1="330" y1="288" x2="490" y2="400"/>
    <line x1="330" y1="288" x2="90" y2="400"/>
    <line x1="330" y1="288" x2="570" y2="400"/>
    <line x1="330" y1="288" x2="10" y2="400"/>
    <line x1="330" y1="288" x2="650" y2="400"/>
    <line x1="330" y1="288" x2="-70" y2="400"/>
    <line x1="330" y1="288" x2="730" y2="400"/>
  </g>
  <line x1="0" y1="288" x2="660" y2="288" stroke="#4fd6ff" stroke-width="1" opacity="0.5"/>

  <!-- Shelf under the icon labels, so dark and light label text both stay readable. -->
  <rect x="70" y="248" width="520" height="26" rx="13" fill="url(#shelf)" opacity="0.28"/>

  <!-- Arrow from tron to Applications. -->
  <g stroke="url(#arrow)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="264" y1="186" x2="392" y2="186"/>
    <polyline points="378,172 394,186 378,200"/>
  </g>

  <text x="330" y="354" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="14" letter-spacing="0.6" fill="#e6dcff" opacity="0.9">Drag tron to Applications</text>
</svg>
