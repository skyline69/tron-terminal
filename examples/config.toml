# tron configuration.
#
# Lives in ~/.config/tron/config.toml, written on the first launch. Every key is
# optional: remove one to get its default.
# tron watches the config directory and applies changes while running.
#
#   ~/.config/tron/config.toml          this file
#   ~/.config/tron/themes/<name>.toml   color themes
#   ~/.config/tron/shaders/<name>.wgsl  post-processing shaders

# Startup screen (welcome, setup, tour) before the shell. Unset: only on the
# first launch. `tron --startup` shows it any time.
# startup = true
# Animate it. false for reduced motion.
# startup_animations = true

# Theme from themes/<name>.toml, or a built-in one: tron, tron-light,
# catppuccin-mocha, dracula, gruvbox-dark, nord, one-dark, rose-pine,
# solarized-dark, tokyo-night.
# theme = "tron-light"

[font]
family = "monospace"
size = 12.0
# Tried in order before system fallback.
fallback = []
# OpenType features, for example ["ss01", "zero"].
features = []
# Programming ligatures. false disables calt, liga and dlig.
ligatures = true
# Separate families for styled text. Default: family.
# bold_family = "Iosevka Heavy"
# italic_family = "Victor Mono"
# bold_italic_family = "Victor Mono"
# Variable font axes.
# variations = { wght = 450, wdth = 90 }
# Outline hinting: auto (on below 1.5x scale), on or off.
hinting = "auto"
# Reorder rows with right-to-left text (Arabic, Hebrew) for display.
bidi = true

[window]
title = "tron"
padding_x = 10
padding_y = 8
# Background opacity from 0.0 to 1.0.
opacity = 1.0
# Blur what is behind a translucent window (KDE Plasma).
blur = false
decorations = true
columns = 100
rows = 30
# Close the window when the shell exits. false keeps it open until a key press.
close_on_exit = true

[cursor]
# block, beam or underline
shape = "block"
# app: blink when the application asks for it. always or never override it.
blinking = "app"
blink_interval_ms = 530

# Overrides applied on top of the theme.
[colors]
# foreground = "#c7d5e0"
# background = "#0a0e14"
# cursor = "#4fd6ff"
# cursor_text = "#0a0e14"
# selection_background = "#1f4a6b"
# selection_foreground = "#ffffff"
# normal = ["#1b2230", "#ff5c75", "#5ce6a6", "#ffc86b", "#4f9dff", "#c38bff", "#4fd6ff", "#c7d5e0"]
# bright = ["#4a5568", "#ff8095", "#86f0bf", "#ffd99a", "#7fb8ff", "#d6adff", "#8ae6ff", "#eef4f8"]
# Draw bold text in ANSI colors 0-7 with the bright variant.
# bold_is_bright = false

[scrollback]
lines = 10000
# Lines per mouse wheel step.
multiplier = 3.0

[shell]
# program = "/usr/bin/fish"
# args = ["--login"]
# "xterm-tron" uses the bundled terminfo entry. Use "xterm-256color" for
# remote hosts without it.
term = "xterm-tron"
# env = { EDITOR = "nvim" }

[selection]
word_separators = ",│`|:\"'()[]{}<>"
# Copy selections to the primary selection (middle click paste).
copy_on_select = true

[clipboard]
# OSC 52 access for applications: disabled, copy or copy-paste.
osc52 = "copy"

[shader]
# WGSL files from shaders/, applied in order. Built in, no file needed:
# crt.wgsl, bloom.wgsl, cursor-glow.wgsl, cursor-trail.wgsl, afterglow.wgsl.
files = []
# auto redraws continuously when a shader reads tron.time or tron.frame.
# always or never force it.
animation = "auto"

[images]
# Memory for decoded kitty graphics protocol images, in MiB.
memory_limit = 320
# Let applications send images as file paths.
file_transfer = true

[bell]
# none, visual (flash), attention (urgency hint when unfocused) or both.
mode = "attention"

[links]
# Program that opens links clicked with Ctrl.
open_command = "xdg-open"

[notifications]
# Desktop notifications from applications (OSC 9, 99 and 777): never,
# unfocused (only while the window has no focus) or always.
mode = "unfocused"
# Run as: command --app-name tron -- title body
command = "notify-send"

# Key combination = action. Entries override the defaults, "none" removes one.
# Actions: copy, paste, paste_selection, increase_font_size, decrease_font_size,
# reset_font_size, scroll_line_up, scroll_line_down, scroll_page_up,
# scroll_page_down, scroll_to_top, scroll_to_bottom, clear_scrollback,
# scroll_to_previous_prompt, scroll_to_next_prompt, select_command_output,
# copy_command_output, search, new_window, reload_config, text:<text to send>, none.
[keybindings]
# "ctrl+shift+c" = "copy"
# "ctrl+shift+v" = "paste"
# "ctrl+shift+f" = "search"
# "ctrl+shift+z" = "scroll_to_previous_prompt"
# "ctrl+shift+x" = "scroll_to_next_prompt"
# "ctrl+shift+g" = "select_command_output"
# "ctrl+shift+n" = "new_window"
# "alt+enter" = "none"
