[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]
default-members = ["crates/tron"]

[workspace.package]
version = "0.4.1"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
authors = ["Ö. Efe D."]
repository = "https://github.com/skyline69/tron-terminal"
homepage = "https://github.com/skyline69/tron-terminal"

[workspace.dependencies]
tron-core = { path = "crates/tron-core" }
tron-pty = { path = "crates/tron-pty" }
tron-font = { path = "crates/tron-font" }
tron-render = { path = "crates/tron-render" }
tron-config = { path = "crates/tron-config" }
tron-startup = { path = "crates/tron-startup" }
tron-inspect = { path = "crates/tron-inspect" }

accesskit = "0.25.0"
accesskit_macos = "0.27.0"
accesskit_unix = "0.23.0"
anyhow = "1.0.104"
arboard = { version = "3.6.1", default-features = false }
base64 = "0.23.1"
bitflags = "2.13.2"
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.9"
bytemuck = { version = "1.25.2", features = ["derive"] }
foldhash = "0.2.0"
gif = "0.14.2"
fontique = "0.11.1"
harfrust = "0.13.3"
log = "0.4.34"
env_logger = "0.11.11"
egui = "0.36.2"
egui-wgpu = { version = "0.36.2", default-features = false }
etcetera = "0.11.0"
memchr = "2.8.3"
miniz_oxide = "0.9.1"
notify = "9.0.0-rc.5"
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSApplication",
    "NSAttributedString",
    "NSEvent",
    "NSFont",
    "NSFontDescriptor",
    "NSFontManager",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSView",
    "NSWindow",
    "objc2-core-foundation",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes", "CFString", "CFURL"] }
objc2-core-text = { version = "0.3.2", default-features = false, features = ["std", "CTFont", "CTFontDescriptor"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSAttributedString",
    "NSDictionary",
    "NSGeometry",
    "NSObject",
    "NSString",
    "NSURL",
    "objc2-core-foundation",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "CAMetalLayer"] }
parking_lot = "0.12.5"
png = "0.18.1"
ratatui = "0.30.2"
tachyonfx = { version = "0.25.2", default-features = false, features = ["std", "std-duration"] }
pollster = "1.0.1"
rustix = { version = "1.1.4", features = ["pty", "termios", "process", "fs", "stdio", "shm", "mm", "param"] }
smithay-clipboard = "0.7.3"
serde = { version = "1.0.229", features = ["derive"] }
swash = "0.2.10"
thiserror = "2.0.20"
toml = "1.1.6"
toml_edit = "0.25.15"
unicode-bidi = "0.3.18"
unicode-width = "0.2.2"
wgpu = "30.0.1"
winit = "0.31.0-beta.3"
zune-jpeg = "0.5.15"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2

[profile.bench]
inherits = "release"
strip = false
debug = true
